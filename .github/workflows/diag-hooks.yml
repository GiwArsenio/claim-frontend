name: Diag hooks
on:
  push:
    branches: ['diag/hooks-statique']
jobs:
  statique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: python3 --version
      - name: Statique
        run: node tools/run-tests.cjs --famille=statique
      - name: Hooks seuls
        run: node --test tests/hook_verification.test.cjs
