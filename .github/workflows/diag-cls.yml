name: Diagnostic CLS (temporaire)
on:
  push:
    branches: [design/diag-cls3]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: SANS la correction du code (attendu - rouge) - sortie complete
        run: |
          git checkout origin/main -- index.html
          grep -c sousTitre index.html || true
          node tools/run-tests.cjs --fichier=tests/accueil_releve.test.cjs 2>&1 | grep -E "✖|✔|AssertionError|a bougé|Error" | cut -c1-300 || true
