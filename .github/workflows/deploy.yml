# CLAIM! — Deploiement du frontend sur Cloudflare Workers.
#
# Le code reste versionne sur GitHub : c'est la source de verite. Ce
# workflow ne decide de rien, il applique ce que le depot contient.
#
# Ce qui a change le 25 octobre 2026 : le site est servi par un Worker
# Cloudflare, et plus par Vercel. Le deploiement se fait donc par
# `wrangler deploy`. Avant, la fusion dans `main` suffisait : Vercel
# buildait et publiait tout seul. Sans ce workflow, une fusion
# deployerait... rien.
#
# ── POURQUOI PLUSIEURS JOBS (16 novembre 2026) ──────────────────────────
# La chaine prenait 15 a 16 minutes, dont 13,8 pour la seule etape de
# tests : 37 fichiers executes l'un apres l'autre, chacun ouvrant son
# serveur et son navigateur. Rien n'etait lent en soi ; tout attendait.
#
# Desormais :
#   • les controles statiques passent d'abord (1 s) et servent de porte :
#     une erreur de configuration echoue en une minute au lieu de quinze ;
#   • les tests navigateur sont repartis en quatre shards de poids voisin,
#     lances en parallele. Le decoupage est calcule par
#     `tools/run-tests.cjs --shard=i/4`, pas ecrit a la main : ajouter un
#     fichier ne desequilibre rien ;
#   • WebKit n'est plus installe du tout : aucun test ne s'en servait
#     (l'import de `plan_premier_paint` n'etait jamais lu — le test simule
#     iOS par l'agent utilisateur, sous Chromium) ;
#   • les navigateurs sont mis en cache entre les executions.
#
# La couverture ne baisse pas — sauf les largeurs de `affichage-a05` :
# trois en journee (360, 768, 1280), les six chaque nuit. Les bornes de
# rupture 768/769 restent dans les deux jeux : c'est la que tout bascule.
#
# Le jeton de deploiement est un secret du depot
# (`CLOUDFLARE_API_TOKEN`). Il n'apparait jamais dans les journaux.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication a la fois : deux deploiements qui se chevauchent
# sur le meme Worker se marchent dessus, et le second ecrase le premier
# sans qu on le voie.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Trois largeurs en integration continue. La nuit, la suite reprend les
  # six — voir nuit.yml.
  LARGEURS: '360,768,1280'

jobs:
  # ── La porte ──────────────────────────────────────────────────────────
  # Dix-huit fichiers sans navigateur, plus la verification d'alignement
  # du rendu. Une seconde de tests : tout le reste attend celle-ci.
  statique:
    name: Controles statiques
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Tests statiques
        run: node tools/run-tests.cjs --famille=statique

      # L'alignement du rendu : le Worker rend les fiches d'offre, et ce
      # rendu doit rester identique a celui de la production de
      # reference (api/offre.js). Le script echoue aussi si l'annuaire a
      # ete duplique — la copie qui avait divergi en silence.
      - name: Verifier l'alignement du rendu
        run: npm run aligner:rendu:verifier

  # ── Les tests navigateur, en quatre shards ────────────────────────────
  tests:
    name: Navigateur ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: statique
    timeout-minutes: 25
    strategy:
      # Un shard rouge ne doit pas annuler les trois autres : le rapport
      # complet dit plus qu'un seul echec.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Le telechargement des navigateurs est identique d'une execution a
      # l'autre : la cle ne depend que du verrou de dependances.
      - name: Cache des navigateurs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests navigateur (shard ${{ matrix.shard }})
        run: node tools/run-tests.cjs --famille=navigateur --shard=${{ matrix.shard }}/4

  # ── La production ─────────────────────────────────────────────────────
  # Ces tests parlent au site en ligne. Ils alertent sans bloquer : la
  # production peut tomber sans que le code soit en cause.
  production:
    name: Controles de production
    runs-on: ubuntu-latest
    needs: statique
    # La production peut tomber sans que le code soit en cause : ces tests
    # alertent, ils ne bloquent pas. Ils ne bloquaient deja pas avant — le
    # lanceur les exclut par defaut — et ils ne doivent pas commencer ici.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Tests de production
        run: node tools/run-tests.cjs --famille=production

  # ── Le rendu visuel, en parallele et sans bloquer ─────────────────────
  # Une reference appartient a la machine qui l'a produite : l'executer
  # ici teste la difference des systemes, pas le site. Il rapporte, il ne
  # decide pas — et il ne figure donc pas dans les `needs` du deploiement.
  visuel:
    name: Rendu visuel (indicatif)
    runs-on: ubuntu-latest
    needs: statique
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Cache des navigateurs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendu visuel
        run: node tools/run-tests.cjs --famille=visuel

  # ── La publication ────────────────────────────────────────────────────
  deploy:
    name: Deployer sur Cloudflare
    runs-on: ubuntu-latest
    needs: [statique, tests]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Preparer les assets statiques
        run: bash scripts/prepare-assets.sh

      - name: Verifier la configuration Cloudflare
        run: npx wrangler deploy --dry-run --outdir=./_dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deployer
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Le deploiement reussi ne prouve pas que le site marche. Ce controle
      # le prouve : les adresses rendues par le Worker, avec les en-tetes
      # de navigation d'un vrai navigateur.
      #
      # Sec-Fetch-Mode: navigate n'est pas un detail : c'est l'en-tete que
      # Cloudflare regarde pour court-circuiter le Worker. Sans lui, le
      # controle voit 200 la ou le navigateur voit 404 — exactement ce
      # qui est arrive le 25 octobre.
      - name: Verifier le site en ligne
        run: node tests-portage/verifier-rendu.js --worker https://claimyourjob.com/fr --ref https://claimyourjob.com/fr

      - name: Verifier les redirections de migration
        run: node tests-portage/verifier-migration.cjs

      - name: Publier le resultat
        if: always()
        run: npx wrangler deployments list | head -5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
